aid: optimal
name: Optimal
description: Optimal is a preventive-health and longevity company based in Mexico City,
  backed by 500 Global, operating across Latin America (Mexico, Colombia, and Peru).
  Optimal offers a consumer blood test that analyzes more than 300 biomarkers and uses
  AI to surface problems before symptoms appear, positioning itself as a predictive
  health platform (branded "health OS") that integrates biological data, wearable metrics,
  behavioral patterns, and medical history into longitudinal health models to identify
  risk before it becomes disease. The company sells directly to consumers via a web app
  and subscriptions and does not currently publish a public developer API, developer
  portal, or API documentation.
